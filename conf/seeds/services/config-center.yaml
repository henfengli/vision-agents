title: 配置中心
description: 各服务运行时配置的发布与审计（Java）
root: /srv/config-center
code_paths: [/srv/config-center]
hosts: [10.0.0.31]
configs:
  - {canonical: /srv/config-center/application.yaml, template: "/srv/config-center/conf/application.{env}.yaml"}
processes:
  app:
    cmd: [./bin/config-center, --port, "{port}"]
    workdir: /srv/config-center
    ports: {prod: 9080, test: 9081, dev: 9082}
envs:
  dev: {enabled: false}               # 开发环境没部署配置中心
profile:
  no_go: 发布接口在 prod 只读调用，审计只看不改
