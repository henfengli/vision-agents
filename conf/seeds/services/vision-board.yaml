title: Vision Board
description: Vision 报表展示系统（Django）：报表页面与离线 HTML 导出；nginx + 源码服务
# 同机部署：agent 装在各环境的部署主机上，读的是线上的代码目录、用的是线上的 conda 环境。
# 【占位，按实际改】代码目录、conda 环境、settings 后缀、日志路径；~ 是部署用户的 home
root: ~/deploy/vision-board
python: ~/miniconda3/envs/vision-board/bin/python
# 项目约定：每个环境一份 vision_board/settings{后缀}.py，DJANGO_SETTINGS_MODULE 指过去
env_vars: {DJANGO_SETTINGS_MODULE: "vision_board.settings-{env}"}
databases:
  ck: "clickhouse://${CK_RO_USER}:${CK_TEST_RO_PASSWORD}@172.24.17.66:8123/default"
# 生产的 settings agent 看不到，py 里盖上控制台填的只读版（库口令换成只读账号；STATIC_ROOT、认证照抄即可）；
# 测试直接用真实的 settings-test.py，不用填
configs:
  - ~/deploy/vision-board/vision_board/settings-{env}.py
logs:
  app: ~/deploy/vision-board/vision-board.log
  access: ~/deploy/vision-board/vision-board-access.log
  crontab: ~/deploy/vision-board/crontab.log
  nginx_access: /var/log/nginx/access.log       # 平台用户要有读权限（见部署指南）
  nginx_error: /var/log/nginx/error.log
envs:
  prod:
    urls: {site: "https://vision-board.moon-prod.ipa.zs/"}
    databases:
      ck: "clickhouse://${CK_RO_USER}:${CK_PROD_RO_PASSWORD}@172.168.0.125:8123/default"
  test:
    urls: {site: "https://vision-board.ipa.zs/"}
profile:
  conventions: 每个环境一份 settings：vision_board/settings-{环境}.py，DJANGO_SETTINGS_MODULE=vision_board.settings-{环境}；manage.py 命令都按它的配置走
  no_go: 不执行 python manage.py crontab add / collectstatic / migrate 这类会改线上状态的命令；不改 nginx
  env_notes: nginx + 源码服务：生产 172.24.16.100（https://vision-board.moon-prod.ipa.zs/），测试 172.21.0.45（https://vision-board.ipa.zs/）。离线 HTML 导出用代码目录里的 chrome-linux
  code_refs: report/（报表）、templates/、vision_board/（项目配置与 settings）、scripts/、check_deps.py（依赖检查脚本）
  upstream: ClickHouse 国内生产 172.168.0.125、国内测试 172.24.17.66；登录走认证服务（settings 里配应用授权）
  runbook: 运维 @李艳东
