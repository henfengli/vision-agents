# 任务 = 要做的事：归属（服务 / "*" 通用 / 不写 = 平台任务）+ 形态（agent / builtin）+ 输入 + 触发 + 投递。
# 子任务写成 "父任务:对象名"，只写和父任务不同的字段（比如某个资产的档案）；调用时点名不存在就自动建。
# ask 是通用入口：任何服务、任何环境直接提问或交代一件事，不用先建任务；要定时、事件、投递、去重时再建正式任务。

ask:
  title: 问一下
  description: 通用入口：对这个服务这个环境直接提问或交代一件事
  service: "*"
  role: generalist
  input:
    question: {type: text, required: true, description: 问题或要做的事}
  triggers: [{id: chat, type: chat}, {id: api, type: api}]
  timeout_s: 900

failure-analysis:
  title: Dagster 失败分析
  description: >-
    资产物化失败时分析根因，结论推到钉钉群。
    手动跑时 run_id、asset_key 给一个就行：只给资产就用 dagster 的工具查它最近一次失败的运行，只给 run_id 就从这次运行里看是哪个资产失败的。
  service: vision-dagster
  role: ops_analyst
  envs: [prod, test]
  # 都不必填：Dagster 的回调总会带齐；手动跑时知道哪个填哪个（agent 自己去 Dagster 补全）
  input:
    run_id: {type: str, description: Dagster run id（不填就查这个资产最近一次失败的运行）}
    asset_key: {type: str, description: 失败的资产}
    error: {type: text, description: 报错堆栈（不填就按 run_id 去 Dagster 查日志）}
  # 每个资产一个子任务（档案、记忆按资产分开）：asset_key 就是子任务的对象名，事件里带了它就自动落到对应子任务
  object_input: asset_key
  triggers:
    # 在 Dagster 里配 run_failure_sensor，回调 POST /v1/events/dagster：{run_id, asset_key, error, env}
    - id: on-failure
      type: event
      source: dagster
      event: run_failure
      session: "dagster:{asset_key}:{error_class}:{date}"
      rules:
        - {pattern: "connection.*(refused|timeout|reset)", category: infra, conclusion: 数据库/服务连接失败，检查目标服务存活与网络}
        - {pattern: "out of memory|oom|memoryerror", category: infra, conclusion: 内存不足：检查资源配额或拆分分区}
    - {id: api, type: api}
  deliver: {channel: default}
  dedup: {key: run_id, window_s: 600}
  timeout_s: 900
  # 模型 429、执行进程被杀这类临时性失败自动续跑；一下涌进几十条失败时每个环境最多同时分析 4 条，其余排队
  retry: {max: 2, delay_s: 120}
  concurrency: 4
  profile:
    pitfalls: 资产失败先看上游资产是否完成，多数失败是上游延迟级联；先用 dagster 的 MCP 工具看线上这次运行的日志

data-qa:
  title: 数据口径问答
  description: 业务方提问指标口径与取数
  service: "*"
  role: data_searcher
  input:
    question: {type: text, required: true, description: 问题}
  triggers: [{id: chat, type: chat}, {id: api, type: api}]
  timeout_s: 600

frontend-smoke:
  title: Board 冒烟测试
  description: GitLab 部署成功后检查报表页面与接口
  service: vision-board
  role: qa_engineer
  envs: [test, prod]
  # 部署事件总会带上版本；手动跑不填 = 测线上现在部署的那一版
  input:
    version: {type: str, description: 部署版本（ref）；不填 = 测线上现在部署的那一版}
    project: {type: str, description: GitLab 项目}
  triggers:
    - {id: on-deploy, type: event, source: gitlab, event: deployment, filter: {project: "^vision-board$"}, map: {version: ref, project: project}}
    - {id: api, type: api}
  deliver: {channel: default}
  dedup: {key: version, window_s: 1800}
  timeout_s: 900

daily-inspection:
  title: Board 日常巡检
  description: 每天早上检查报表数据新鲜度与线上页面
  service: vision-board
  role: inspector
  envs: [prod, test]
  input:
    scope: {type: enum, options: [full, quick], default: full}
  triggers:
    - {id: morning, type: schedule, cron: "50 8 * * *", envs: [prod, test], input: {scope: full}}
    - {id: api, type: api}
  deliver: {channel: default}
  timeout_s: 900

# 每个服务×环境各跑一次，由部署它的那台主机上的 agent 服务执行（读的是那台主机上线上的代码目录）。
# 代管的环境（过渡期测试机代管 prod）这一轮跳过：本机的代码不是那个环境的，核对不了
memory-gardener:
  title: 记忆园丁
  description: 夜间维护：记忆里引用的代码在线上代码目录里改过了，就标为过期
  service: "*"
  form: builtin
  handler: memory-gardener
  triggers:
    - {id: nightly-dagster, type: schedule, cron: "0 3 * * *", service: vision-dagster, envs: [prod, test]}
    - {id: nightly-board, type: schedule, cron: "10 3 * * *", service: vision-board, envs: [prod, test]}
    - {id: nightly-web, type: schedule, cron: "20 3 * * *", service: vision-web, envs: [prod, test]}
    - {id: api, type: api}
  timeout_s: 1800
