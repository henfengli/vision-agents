# 部署配置（所有机器共享的默认值）。env/{AGENT_ENV}.yaml 只写差异（深合并），本机的
# ~/.config/agent-platform/local.yaml 再写这台机器自己的（负责哪个环境、监听）；${VAR} 从环境变量取。
#
# 这里只放"这台平台怎么跑起来"：数据库、模型、执行并发、沙箱与资源上限、引导密钥、外部系统地址。
# 服务 / 角色 / 任务与平台配置（环境、通知、记忆、提示词）都在控制台里改，存库、带版本；
# conf/seeds/ 只在库里还没有对应对象时播种一次。

# 模型：OpenAI 兼容协议。Kimi（月之暗面）开放平台；token 放 secrets.env 的 MODEL_TOKEN_A
model:
  url: https://api.moonshot.cn/v1
  name: kimi-k2.7-code              # 这把 key 能用的：kimi-k2.7-code、kimi-k2.6（GET /v1/models 可查）
  # 账号并发上限：同时在途的请求数，prod、test 两边、agent 与辅助调用合计（经共用的库），有空位就立刻发
  max_concurrency: 3
  context_tokens: 400000            # 模型上下文长度：对话历史到 75% 时自动压缩成摘要
  max_retries: 6
  # embedding_name: bge-m3          # 配了才开向量检索；不配退化为 pg_trgm 关键词检索（Kimi 没有嵌入接口）

# 执行队列就是 PG 里的 runs 表（不依赖别的编排服务）：一台主机同时执行几个运行
worker:
  max_concurrent_runs: 4

# 项目内核（py 工具）：每个 会话×服务×环境 一个常驻 Python 进程。和线上服务同机，宁少勿多
kernel:
  idle_minutes: 30                  # 空闲多久回收
  max_kernels: 3                    # 同时最多几个（超了回收最久没用的）

# 模型写的代码（项目内核、bash）各跑在一个 systemd 用户 scope 里：内存超了只杀它自己，不波及线上服务。
# 只管内存，CPU 不设上限。生产机和测试机内存一样，所有主机用同一组固定值。
# 生产 / 测试主机打开（prod.yaml）；这些 scope 都在 agent.slice 里，合计最多 64G（deploy/user/agent.slice）；平台进程不在里面
limits:
  enabled: false
  kernel_memory: 32G                # 每个项目内核
  bash_memory: 8G                   # 每条 bash 命令
  tasks: 4096                       # 每个 scope 的进程 + 线程数（numpy 等按核数开线程，别设小）

# 没有 bwrap 时拒绝执行模型写的代码（开发机可以关）
require_sandbox: true

# 沙箱里 home 整个是空的，只挂回代码目录、conda 环境、方法目录。项目运行要用到 home 下别的目录（只读）时写这里
# home_allow: [~/.local/lib]
# 沙箱里额外遮蔽的路径（home 以外的；存在的才遮）。不写 = docker 的 socket。
# 服务声明的 configs / hidden 不用写在这里：生产的运行里都遮，测试的运行里只遮生产的（平台配置 envs 的 protected）
# hidden_paths: [/var/run/docker.sock, /run/docker.sock]

# 可选的后台链路追踪：OTLP/HTTP 导出到任意兼容后端（Jaeger、Tempo、各家 APM）。
# 运行详情的时间线（含每次模型调用的耗时与 token）来自平台自己的 run_events，不依赖它。需要装 obs 依赖。
otel:
  enabled: false
  endpoint: http://127.0.0.1:4318/v1/traces
  headers: {}                       # 鉴权头，如 {Authorization: "Bearer ${OTEL_TOKEN}"}

# 数据保留（天），维护循环每 6 小时清一次；运行台账本身（输入、输出、配方）一直保留
retention:
  run_events_days: 90               # 运行过程事件（被 👎 过的运行不清，回归重放要用）
  checkpoints_days: 30              # 会话的 checkpoint（最后一轮结束这么久后清，之后不能再续跑）
  recall_hits_days: 90              # 召回埋点
  scratch_days: 7                   # 本机的工作目录（db_query 结果文件、agent 写的临时文件）

# Grafana（host_metrics 工具用）：datasource_uid 是 Prometheus 数据源的 uid，token 用只读账号。整段不配则工具不出现。
# 同机部署时本机状况已经有 host_status 工具（不用 Grafana）
# grafana:
#   url: http://grafana.internal:3000
#   datasource_uid: prometheus
#   token: "${GRAFANA_TOKEN}"

# 平台 MCP（可选）：通用能力，{名字: langchain-mcp-adapters 连接配置}。角色里写工具名，或 "mcp:<名字>" 引用整个 server。
# 某个服务特有的能力（比如 dagster 的 GraphQL）写在服务定义的 mcp 里，运行在该服务上时自动出现，不用写进角色。
# 这里也能写 service（只在该服务的运行里可用）和 envs（每个环境一份连接，调用按运行的环境路由）。
# mcp_servers:
#   browser:                           # qa_engineer 角色用 "mcp:browser"；页面地址来自服务的 urls
#     transport: stdio
#     command: npx
#     args: ["-y", "@playwright/mcp@0.0.83", "--headless", "--isolated", "--output-dir", "/home/<用户>/.local/share/agent-platform/scratch"]
