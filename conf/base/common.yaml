# 部署配置（所有机器共享的默认值）。env/{AGENT_ENV}.yaml 只写差异（深合并）；${VAR} 从环境变量取。
#
# 这里只放"这台平台怎么跑起来"：数据库、模型、执行并发、引导密钥、外部系统地址。
# 服务 / 角色 / 任务与平台配置（环境、审批、通知、记忆、进程）都在控制台里改，存库、带版本；
# conf/seeds/ 只在库里还没有对应对象时播种一次。

model:
  url: https://internal-llm/v1
  name: internal-model-v3
  max_concurrency: 10
  # embedding_name: bge-m3          # 配了才开向量检索；不配退化为 pg_trgm 关键词检索

# 执行队列就是 PG 里的 runs 表（不依赖别的编排服务）：同时执行几个运行
worker:
  max_concurrent_runs: 10

# 项目内核（py 工具）：每个 会话×服务×环境 一个常驻 Python 进程
kernel:
  idle_minutes: 30                  # 空闲多久回收
  max_kernels: 8                    # 同时最多几个（超了回收最久没用的）

process_control:
  backend: local                    # systemd（生产）/ local（开发机）/ off
  scope: system                     # system：系统级单元 + polkit（deploy/install.sh）；user：systemd --user（deploy/install-user.sh）
  unit: agent-svc                   # systemd 模板单元名：agent-svc@<服务:环境:进程>.service

# agent 沙箱与业务进程里都遮蔽的路径（存在的才遮；目录换成空目录）。服务声明的配置文件总是遮蔽，不用写在这里。
# 不写 = 平台密钥目录 + 运行用户的 ~/.ssh、~/.git-credentials、~/.netrc、~/.pgpass、~/.config/agent-platform
# hidden_paths: [/etc/agent-platform, /home/agent/.ssh]

langfuse:
  enabled: false                    # 可选的后台链路追踪（OTEL → Langfuse），页面不依赖它
  host: http://127.0.0.1:3000
  public_key: ""
  secret_key: ""

# Grafana（host_metrics 工具用）：datasource_uid 是 Prometheus 数据源的 uid，token 用只读账号。整段不配则工具不出现。
# grafana:
#   url: http://grafana.internal:3000
#   datasource_uid: prometheus
#   token: "${GRAFANA_TOKEN}"

# 平台 MCP（可选）：通用能力，{名字: langchain-mcp-adapters 连接配置}。角色里写工具名，或 "mcp:<名字>" 引用整个 server。
# 某个服务特有的能力（比如 dagster 的 GraphQL）写在服务定义的 mcp 里，运行在该服务上时自动出现，不用写进角色。
# 这里也能写 service（只在该服务的运行里可用）和 envs（每个环境一份连接，调用按运行的环境路由）。
# mcp_servers:
#   browser:                           # qa_engineer 角色用 "mcp:browser"；页面地址来自服务的 urls
#     transport: stdio
#     command: npx
#     args: ["-y", "@playwright/mcp@0.0.83", "--headless", "--isolated", "--output-dir", "/var/lib/agent-platform/scratch"]
