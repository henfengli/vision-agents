# 部署配置（所有机器共享的默认值）。env/{AGENT_ENV}.yaml 只写差异（深合并）；${VAR} 从环境变量取。
#
# 这里只放"这台平台怎么跑起来"：数据库、模型、Temporal、引导密钥、外部系统地址。
# 服务 / 角色 / 任务 / 策略与平台配置（环境、审批、通知、记忆、进程）都在控制台里改，存库、带版本；
# conf/seeds/ 只在库里还没有对应对象时播种一次。

model:
  url: https://internal-llm/v1
  name: internal-model-v3
  max_concurrency: 10
  # embedding_name: bge-m3          # 配了才开向量检索；不配退化为 pg_trgm 关键词检索

temporal:
  address: 127.0.0.1:7233
  namespace: default
  task_queue: agent-platform

process_control:
  backend: local                    # systemd（生产）/ local（开发机）/ off
  unit: agent-svc                   # systemd 模板单元名：agent-svc@<服务:环境:进程>.service

langfuse:
  enabled: false                    # 可选的后台链路追踪（OTEL → Langfuse），页面不依赖它
  host: http://127.0.0.1:3000
  public_key: ""
  secret_key: ""

# Grafana（host_metrics 工具用）：datasource_uid 是 Prometheus 数据源的 uid，token 用只读账号。整段不配则工具不出现。
# grafana:
#   url: http://grafana.internal:3000
#   datasource_uid: prometheus
#   token: "${GRAFANA_TOKEN}"

