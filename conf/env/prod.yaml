# 生产环境：危险操作强制人工审批 + Langfuse 观测与 prompt 源头（继承 common.yaml，只写差异）
host: 0.0.0.0

# 单部署多目标环境：一套 agent 服务操作多套业务环境（请求级 env 字段区分，
# API/网页/触发器都带 env；run、记忆、提交闸门按它分区）。
# 不配这两行 = 单环境部署，一切照旧（目标环境=实例标签）。
target_envs: [prod, test, dev]
default_target_env: test             # 缺省打到测试环境：生产操作必须显式指定 env

model:
  tokens: ["${MODEL_TOKEN_A}", "${MODEL_TOKEN_B}"]

db_dsn: "postgresql://agent:${AGENT_DB_PASSWORD}@127.0.0.1:5432/agent_platform"
dingtalk_token: "${DINGTALK_ACCESS_TOKEN}"
bearer_token: "${AGENT_BEARER_TOKEN}"
viewer_base_url: "https://agent-viewer.prod.internal"

approvals:
  enabled: true                      # 生产：危险操作强制人工审批（patterns 继承 common）

langfuse:
  enabled: true
  host: http://langfuse.internal:3000
  public_key: "${LANGFUSE_PUBLIC_KEY}"
  secret_key: "${LANGFUSE_SECRET_KEY}"
  prompt_label: production           # 角色定义拉取的 label
  prompt_cache_ttl_s: 10

# 内部 MCP 服务器（可选）：{名字: langchain-mcp-adapters 连接配置}
# 仓库自带三个 stdio server（mcp_servers/）：dagster 报错分析、browser 网页
# 冒烟、datahub 元数据/血缘；server 端依赖见 pyproject 的 browser/datahub extras
# mcp_servers:
#   dagster:
#     transport: stdio
#     command: python
#     args: ["mcp_servers/dagster_mcp.py"]
#   browser:
#     transport: stdio
#     command: python
#     args: ["mcp_servers/browser_mcp.py"]
#   datahub:
#     transport: stdio
#     command: python
#     args: ["mcp_servers/datahub_mcp.py"]
