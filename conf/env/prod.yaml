env: prod

server:
  host: 0.0.0.0
  port: 8100

model:
  url: https://internal-llm/v1
  name: internal-model-v3
  tokens: ["${MODEL_TOKEN_A}", "${MODEL_TOKEN_B}"]
  max_concurrency: 10

db:
  dsn: "postgresql://agent:${AGENT_DB_PASSWORD}@127.0.0.1:5432/agent_platform"


dingtalk:
  relay_url: "https://alert-notification.ipa.zs/robot/send"
  access_token: "${DINGTALK_ACCESS_TOKEN}"

viewer_base_url: "https://agent-viewer.prod.internal"

approvals:
  enabled: true                      # 生产：危险操作强制人工审批
  danger_patterns: ['\brm\s+-[rf]', '\bdrop\b', '\btruncate\b', '\bkill\b', '\bsystemctl\b']

scratch_dir: /var/lib/agent-platform/scratch
bearer_token: "${AGENT_BEARER_TOKEN}"

temporal:
  address: 127.0.0.1:7233          # Temporal server（同机 systemd 部署）
  namespace: default
  task_queue: agent-platform

langfuse:
  enabled: true
  host: http://langfuse.internal:3000
  public_key: "${LANGFUSE_PUBLIC_KEY}"
  secret_key: "${LANGFUSE_SECRET_KEY}"
  prompt_label: production         # 角色定义拉取的 label
  prompt_cache_ttl_s: 10
  record_content: true             # false=trace 只带长度（脱敏）
