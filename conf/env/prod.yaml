# 生产 / 测试主机上的 agent 服务（同机部署，deploy/install-user.sh）：跑在部署项目的那个用户的 systemd --user 里，
# 不需要 root。prod、test 共用一个库和一套控制台；每台机器自己的值写在 ~/.config/agent-platform/local.yaml：
#   生产机：      env: prod
#   测试机（dagster）：env: test，services: [vision-dagster]
#   测试机（board）：  env: test，services: [vision-board, vision-web]   ← vision-web 测试在哪台【占位】
db_dsn: "postgresql://agent:${AGENT_DB_PASSWORD}@${AGENT_DB_HOST}:5432/agent_platform"
root_token: "${AGENT_ROOT_TOKEN}"
public_url: "https://agent.internal"   # 用户实际访问的地址（提供控制台的那台）：通知里的链接用它，https 时登录 cookie 带 Secure

model:
  tokens: ["${MODEL_TOKEN_A}"]        # 多把 key 就都列上，按请求轮换
  # 备用模型（第二套）：主模型（common.yaml 的 kimi-k2.7-code）重试完还失败（max_retries / timeout_retries），
  # 这一步换备用模型接着跑，任务不中断；之后 fallback_hold_s 秒内都先用备用，过了再试主模型。
  # 只写和主模型不同的：现在是同一个 Kimi 账号换个模型（同一份 key、同一份并发名额），防的是主模型本身出问题。
  # 要防账号 / 平台整体出问题（欠费、限流、Kimi 挂了），就换成另一个账号或另一家 OpenAI 兼容的服务：
  #   url: https://api.deepseek.com/v1     # 【占位】
  #   tokens: ["${MODEL_FALLBACK_TOKEN}"]  # 口令写 secrets.env
  #   max_concurrency: 3                   # 那个账号自己的并发上限
  # name 留空 = 不用备用模型。
  fallback:
    name: kimi-k2.6                    # 【占位：确认这把 key 能用、效果可以接受】
    context_tokens: 262144             # 【占位：按它的实际上下文窗口】；比主模型小时，压缩阈值按它算

# 和线上服务同机：模型写的代码限内存
limits:
  enabled: true

# 监听：默认只听 127.0.0.1:8100。提供控制台的那台在它的 local.yaml 里打开，平台自己做 HTTPS（端口要 ≥ 1024），
# public_url 相应写成 https://<主机名>:8100：
# listen:
#   host: 0.0.0.0
#   port: 8100
#   tls_cert: ~/.config/agent-platform/tls/cert.pem
#   tls_key: ~/.config/agent-platform/tls/key.pem

# 有 OTLP 后端（Jaeger / Tempo / APM）时打开；口令写 secrets.env，这里用 ${VAR} 引用
# otel:
#   enabled: true
#   endpoint: http://otel-collector.internal:4318/v1/traces
#   headers: {Authorization: "Bearer ${OTEL_TOKEN}"}
