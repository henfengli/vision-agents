# 开发机：本地 Postgres，单机（不写 env：执行所有环境的运行），没有 bwrap 时也让代码跑起来（不隔离）。
db_dsn: "postgresql://agent:${AGENT_DB_PASSWORD}@127.0.0.1:5432/agent_platform"
root_token: "${AGENT_ROOT_TOKEN}"
public_url: "http://127.0.0.1:8100"
require_sandbox: false

model:
  tokens: ["${MODEL_TOKEN_A}"]
  # 备用模型：开发机默认不配；要试切换就打开（和 prod.yaml 一样的写法）
  # fallback: {name: kimi-k2.6}
