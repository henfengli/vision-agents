[project]
name = "agent-client"
version = "2.0.0"
description = "agent-platform /v1 接口的 Python 封装与 agent-chat 终端对话"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
agent-chat = "agent_client.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_client*"]
