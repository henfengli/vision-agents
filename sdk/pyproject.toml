[project]
name = "agent-client"
version = "1.3.0"
description = "agent-platform 客户端参考封装与 agent-chat CLI"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
agent-chat = "agent_client.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_client*"]
