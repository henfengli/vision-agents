{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block content %}
{{ m.page_head("CHAT", "Agent 对话", "流式输出 · 会话可续聊 · 结论可直接反馈") }}
<div class="chat-layout">
  <aside class="chat-side">
    <button id="new-chat" class="new-chat">+ 新对话</button>
    <div id="sessions"><div class="meta" style="padding:6px">加载中…</div></div>
  </aside>
  <section class="chat-main">
    <div class="card chat-config">
      <select id="server" title="业务系统">
        {% for d in domains %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
      </select>
      <select id="role" title="角色">
        {% for r in roles %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
      </select>
      {% if target_envs %}
      <select id="env" title="目标环境">
        <option value="">目标环境：默认</option>
        {% for e in target_envs %}<option value="{{ e }}">{{ e }}</option>{% endfor %}
      </select>
      {% endif %}
      <span class="meta" id="sess-label" style="margin-left:auto"></span>
    </div>
    <div class="chat-log" id="log"></div>
    <div class="composer">
      <textarea id="q" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="stop" class="danger" style="display:none">停止</button>
      <button id="send">发送</button>
    </div>
  </section>
</div>
<script src="/static/marked.min.js"></script>
<script src="/static/dompurify.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const log = $("log");
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
marked.setOptions({breaks: true});
const md = t => DOMPurify.sanitize(marked.parse(t));

let sessionId = "", lastQuestion = "", ctrl = null, streaming = false;

/* —— 输出渲染：结论优先 answer 字段的 Markdown，否则 JSON 代码块 —— */
function outputHtml(out) {
  if (out && typeof out.answer === "string") return md(out.answer);
  return "<pre><code>" + esc(JSON.stringify(out, null, 2)) + "</code></pre>";
}

/* —— 过程步骤（思考/工具），折叠进 details；open=流式进行中默认展开 —— */
const KIND_LABELS = {thought: "思考", tool_call: "工具调用",
  tool_result: "工具结果", llm: "结论", final: "结论", note: "备注"};
function stepHtml(e) {
  const label = KIND_LABELS[e.kind] || e.kind;
  const tool = e.tool ? ` <span class="tag">${esc(e.tool)}</span>` : "";
  return `<div class="step step-${e.kind}"><div class="meta">
    <span class="kind">${label}</span>${tool}</div>
    <pre>${esc(e.text || "")}</pre></div>`;
}
function detailsHtml(events, open) {
  const list = events.filter(e => e.kind !== "trace" && e.kind !== "graph");
  if (!list.length) return "";
  return `<details class="steps"${open ? " open" : ""}>
    <summary>过程 · ${list.length} 步</summary>
    ${list.map(stepHtml).join("")}</details>`;
}

/* —— 结论反馈条：👍👎 直接落反馈（同 run 详情页表单），右挂 Run 链接 —— */
function fbHtml(runId) {
  return `<div class="fb-bar" data-run="${runId}">
    <button data-score="1" title="有用">👍</button>
    <button data-score="-1" title="有问题">👎</button>
    <span class="fb-state"></span>
    <a class="run-link" href="/runs/${runId}">Run →</a></div>`;
}
document.addEventListener("click", async e => {
  const btn = e.target.closest(".fb-bar button");
  if (!btn) return;
  const bar = btn.closest(".fb-bar");
  bar.querySelectorAll("button").forEach(b => b.disabled = true);
  try {
    const resp = await fetch(`/runs/${bar.dataset.run}/feedback`, {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: `score=${btn.dataset.score}`});
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    bar.querySelector(".fb-state").innerHTML = '<span class="fb-done">✓ 已记录</span>';
  } catch (err) {
    bar.querySelectorAll("button").forEach(b => b.disabled = false);
    bar.querySelector(".fb-state").textContent = "记录失败，重试";
  }
});

/* —— 消息渲染 —— */
function userBubble(q) {
  log.insertAdjacentHTML("beforeend",
    `<div class="msg-user"><b>我</b><pre>${esc(q)}</pre></div>`);
}
function agentBlock() {
  log.insertAdjacentHTML("beforeend", `<div class="msg-agent"></div>`);
  return log.lastElementChild;
}
function agentFinal(block, events, output, runId) {
  block.innerHTML = `<div class="md">${outputHtml(output)}</div>`
    + detailsHtml(events, false) + (runId ? fbHtml(runId) : "");
}
function errorBubble(msg, retry) {
  log.insertAdjacentHTML("beforeend",
    `<div class="msg-err">${esc(msg)}${retry ? '<button id="retry">重试</button>' : ""}</div>`);
  const r = $("retry");
  if (r) r.onclick = () => { r.parentElement.remove(); send(lastQuestion); };
  scrollEnd();
}
function scrollEnd() {
  if (log.lastElementChild)
    log.lastElementChild.scrollIntoView({behavior: "smooth", block: "end"});
}

/* —— 发送（SSE 流式；可停止；失败可重试） —— */
function setStreaming(on) {
  streaming = on;
  $("send").style.display = on ? "none" : "";
  $("stop").style.display = on ? "" : "none";
}
async function send(q) {
  q = (q || "").trim();
  if (!q || streaming) return;
  lastQuestion = q;
  userBubble(q);
  const block = agentBlock();
  block.innerHTML = '<div class="meta">思考中…</div>';
  setStreaming(true);
  scrollEnd();
  const events = [];
  let runId = "";
  ctrl = new AbortController();
  try {
    const resp = await fetch("/v1/chat/stream", {
      method: "POST", headers: {"Content-Type": "application/json"},
      signal: ctrl.signal,
      body: JSON.stringify({server: $("server").value, role: $("role").value,
        question: q, env: ($("env") || {}).value || null,
        session_id: sessionId || null})});
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const r = await reader.read();
      if (r.done) break;
      buf += decoder.decode(r.value, {stream: true});
      const parts = buf.split("\n\n"); buf = parts.pop();
      for (const part of parts) {
        if (!part.startsWith("data: ")) continue;
        const ev = JSON.parse(part.slice(6));
        if (ev.type === "run") {
          sessionId = ev.session_id; runId = ev.run_id;
          localStorage.setItem("chat.session", sessionId);
          $("sess-label").textContent = "session " + sessionId;
          loadSessions();
        } else if (["thought", "tool_call", "tool_result", "note", "llm"].includes(ev.type)) {
          events.push({kind: ev.type, tool: ev.tool || "",
            text: ev.content || ev.args || ev.output || ""});
          block.innerHTML = detailsHtml(events, true)
            + '<div class="meta" style="margin-top:6px">执行中…</div>';
          scrollEnd();
        } else if (ev.type === "final") {
          agentFinal(block, events, ev.output, runId);
        } else if (ev.type === "timeout") {
          block.innerHTML = detailsHtml(events, false)
            + `<div class="msg-err">执行超时，run 仍在后台跑：
               <a href="/runs/${runId}">去详情页看</a></div>`;
        }
      }
    }
  } catch (err) {
    if (err.name === "AbortError") {
      block.innerHTML = detailsHtml(events, false)
        + `<div class="meta">已停止${runId ? `（<a href="/runs/${runId}">run 后台继续</a>）` : ""}</div>`;
    } else {
      block.remove();
      errorBubble("发送失败：" + err.message, true);
    }
  } finally {
    setStreaming(false);
    scrollEnd();
  }
}

/* —— 会话侧栏：列表 + 历史回放 + 配置回填 —— */
async function loadSessions() {
  try {
    const d = await (await fetch("/chat/sessions.json")).json();
    $("sessions").innerHTML = d.sessions.map(s =>
      `<a class="sess-item${s.session_id === sessionId ? " active" : ""}"
          data-sid="${s.session_id}">
        <div class="q">${esc(s.first_q || "（空会话）")}</div>
        <div class="t">${esc(s.last_at.slice(5, 16).replace("T", " "))} · ${s.runs} 轮</div>
      </a>`).join("") || '<div class="meta" style="padding:6px">还没有会话</div>';
  } catch (e) { /* 列表失败不挡对话 */ }
}
async function openSession(sid) {
  const d = await (await fetch(`/chat/sessions/${sid}/history.json`)).json();
  sessionId = sid;
  localStorage.setItem("chat.session", sid);
  if (d.config.server) $("server").value = d.config.server;
  if (d.config.role) $("role").value = d.config.role;
  if ($("env") && d.config.env) $("env").value = d.config.env;
  $("sess-label").textContent = "session " + sid;
  log.innerHTML = "";
  for (const r of d.runs) {
    if (r.question) userBubble(r.question);
    const block = agentBlock();
    if (r.status === "success" || (r.output && Object.keys(r.output).length))
      agentFinal(block, r.events, r.output, r.run_id);
    else
      block.innerHTML = detailsHtml(r.events, false)
        + `<div class="meta">run ${esc(r.status)} · <a href="/runs/${r.run_id}">详情 →</a></div>`;
  }
  loadSessions();
}
document.addEventListener("click", e => {
  const item = e.target.closest(".sess-item");
  if (item) openSession(item.dataset.sid);
});
$("new-chat").onclick = () => {
  sessionId = "";
  localStorage.removeItem("chat.session");
  log.innerHTML = "";
  $("sess-label").textContent = "";
  loadSessions();
  $("q").focus();
};

/* —— 输入区：Enter 发送 / Shift+Enter 换行 / 自动增高 —— */
$("send").onclick = () => { const q = $("q"); send(q.value); q.value = ""; q.style.height = "auto"; };
$("stop").onclick = () => { if (ctrl) ctrl.abort(); };
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const q = e.target; send(q.value); q.value = ""; q.style.height = "auto";
  }
});
$("q").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 180) + "px";
});

/* —— 入口：URL ?session=（run 详情页跳转继承）> 上次会话 > 空 —— */
const want = new URLSearchParams(location.search).get("session")
  || localStorage.getItem("chat.session");
if (want) openSession(want).catch(() => {});
loadSessions();
</script>
{% endblock %}
