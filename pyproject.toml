[project]
name = "agent-platform"
# 版本唯一出处是 src/agent_platform/__init__.py 的 __version__（发版只改那一处）
dynamic = ["version"]
description = "平台级 Agent 服务：多业务角色、事件触发、对话与自动化流程"
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.6.*",          # 锁版本：pre-1.0，角色定义收在自有配置层隔离 API 变更
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",               # 模型连接池用（OpenAI 兼容协议）
    "langchain-openai>=0.2",      # init_chat_model 的 OpenAI provider
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "jinja2>=3.1",               # viewer 服务端模板渲染
    "temporalio>=1.27",           # durable execution：编排/调度/恢复
]

[project.optional-dependencies]
# 测试用标准库 unittest 跑（python3 -m unittest discover -s tests），无额外 dev 依赖
# Langfuse 集成（prompt 源头 + OTEL 观测）：生产建议安装；不装则 langfuse.enabled 不可开
# langfuse 官方 SDK 负责 prompt/score 数据 API；OTEL 三件套负责 tracing 管线
obs = ["langfuse>=4.0,<5.0",
       "opentelemetry-sdk>=1.26", "opentelemetry-exporter-otlp-proto-http>=1.26",
       "openinference-instrumentation-langchain>=0.1"]
# 内部 MCP 服务器接入（可选；不配 mcp_servers 则不需要）
# browser / datahub 用官方实现（@playwright/mcp、mcp-server-datahub），是独立
# 进程的外部运行时（Node.js / uv），不入 Python 依赖；见 conf/env/prod.yaml
mcp = ["langchain-mcp-adapters>=0.1"]
# mcp_servers/dagster_mcp.py 的 server 端依赖（独立进程，不随主服务装）
dagster-mcp = ["fastmcp>=2.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "agent_platform.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
