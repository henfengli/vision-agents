<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent-platform 控制台</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    // 首帧前定主题，避免闪白
    try {
      var t = localStorage.getItem("ap.theme") || "system";
      var host = document.documentElement.getAttribute("data-theme");
      var sys = host === "dark" || (host !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      var dark = t === "dark" || (t === "system" && sys);
      document.documentElement.classList.toggle("dark", dark);
    } catch (e) {}
  </script>
  <!--STYLE-->
</head>
<body>
  <div id="root"></div>
  <!--SCRIPT-->
</body>
</html>
